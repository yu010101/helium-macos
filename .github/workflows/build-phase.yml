name: Build Helium for macOS

defaults:
  run:
    shell: bash

permissions:
  contents: read
  # Idaten: 以前の実行の成果物からコンパイル結果のキャッシュを読むため
  actions: read

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      os:
        required: true
        type: string
      resume:
        required: false
        type: boolean
        default: false
    outputs:
      status:
        value: ${{ jobs.build_job.outputs.status }}

jobs:
  build_job:
    name: Build Helium for macOS
    runs-on: ${{ inputs.os }}
    env:
      # Idaten: 上流は自前の WebDAV キャッシュを secrets で渡している。フォークにはそれが無く、
      # 代わりの GitHub Actions キャッシュ経路は run ステップに接続情報が渡らないため、
      # sccache が起動できず全コンパイルが落ちた(実測 2026-09-23: cache url for ghac not found)。
      # SCCACHE_* が1つでもあれば github_build.sh は GHA 経路に入らないので、ローカルディスクのキャッシュにする
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 20G
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/prepare-environment
      - name: Download resources
        if: ${{ !inputs.resume }}
        uses: actions/download-artifact@v4
        with:
          name: helium_macos_resources_${{ inputs.arch }}
      - name: Unpack resources
        if: ${{ !inputs.resume }}
        run: ./github_unpack_resources.sh
      - name: Prepare for building
        if: ${{ !inputs.resume }}
        run: |
          set -o pipefail
          source ./devutils/shared.sh
          configure_build '${{ inputs.arch }}' true true | tee -a github_actions_build_${{ inputs.arch }}.log
        env:
          PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
      # Idaten: 1段目だけ、以前の完走した実行の成果物からコンパイル結果のキャッシュ(sccache)を読み込む。
      # 変更の無い部品はキャッシュから取り出せるので、パッチを少し直した再ビルドが約1日から大きく縮む見込み。
      # どの実行から読むかはリポジトリ変数 SCCACHE_SEED_RUN_ID(空なら何もしない)
      - name: Download compiler cache seed
        if: ${{ !inputs.resume && vars.SCCACHE_SEED_RUN_ID != '' }}
        uses: actions/download-artifact@v4
        with:
          name: github_build_artifact_${{ inputs.arch }}
          run-id: ${{ vars.SCCACHE_SEED_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sccache_seed
      - name: Unpack compiler cache seed
        if: ${{ !inputs.resume && vars.SCCACHE_SEED_RUN_ID != '' }}
        run: |
          set -eux
          ls -la sccache_seed
          test -f sccache_seed/sccache.tar.zst
          mkdir -p "$(dirname "$SCCACHE_DIR")"
          tar -C "$(dirname "$SCCACHE_DIR")" -xf sccache_seed/sccache.tar.zst
          rm -rf sccache_seed
          du -hs "$SCCACHE_DIR"
      - name: Get previous logs
        if: ${{ inputs.resume }}
        uses: actions/download-artifact@v4
        with:
          name: github_build_logs_${{ inputs.arch }}
      - name: Download build
        if: ${{ inputs.resume }}
        uses: actions/download-artifact@v4
        with:
          name: github_build_artifact_${{ inputs.arch }}
      - name: Unpack archive of build
        if: ${{ inputs.resume }}
        run: ./github_unpack_archive.sh
      - uses: ./.github/actions/do-build
        id: build
        with:
          arch: ${{ inputs.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
          PROD_MACOS_NOTARIZATION_API_KEY_B64: ${{ secrets.PROD_MACOS_NOTARIZATION_API_KEY_B64 }}
          PROD_MACOS_NOTARIZATION_API_KEY_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_API_KEY_ID }}
          PROD_MACOS_NOTARIZATION_API_ISSUER: ${{ secrets.PROD_MACOS_NOTARIZATION_API_ISSUER }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
